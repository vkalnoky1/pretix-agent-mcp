name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: |
          uv sync --locked --extra dev --group build --no-install-project --python ${{ matrix.python-version }}
          uv sync --locked --extra dev --group build --no-build-isolation
      - name: Lint
        run: uv run --locked --no-sync ruff check . && uv run --locked --no-sync ruff format --check .
      - name: Test
        run: uv run --locked --no-sync pytest -q
      - name: No secrets in the repo
        run: |
          # A real pretix token is 40+ chars; a real instance URL is not example.org.
          ! grep -rInE '(Token [A-Za-z0-9]{20,})' --include='*.py' --include='*.md' --include='*.yml' . \
            || (echo "possible credential committed"; exit 1)
