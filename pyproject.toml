[project]
name = "pretix-agent-mcp"
version = "0.1.0"
description = "MCP server that lets agents operate a self-hosted pretix instance without ever seeing the API credential"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Bitcoin Austria" }]
keywords = ["mcp", "pretix", "ticketing", "agent"]
dependencies = [
    "mcp==2.3.0",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
    "starlette==1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6"]

[dependency-groups]
build = ["hatchling==1.33.0"]

[project.scripts]
pretix-agent-mcp = "pretix_agent_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/bitcoinaustria/pretix-agent-mcp"
Issues = "https://github.com/bitcoinaustria/pretix-agent-mcp/issues"

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pretix_agent_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
